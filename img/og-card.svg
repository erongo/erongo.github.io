<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Erongo Software -- Development &amp; products</title>
  <desc id="desc">Social preview card for Erongo Software: software development (consultation, delivery, integrations, automation) and commercial products such as OMS. Namibia-based, delivering worldwide.</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1d21"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#374151" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#3b82f6"/>

  <!-- Brand -->
  <text x="80" y="80" fill="#e5e7eb" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700">erongo<tspan fill="#3b82f6">.</tspan></text>
  <text x="80" y="116" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="500">Software development &amp; products -- based in Namibia, delivering worldwide</text>

  <!-- Divider -->
  <rect x="80" y="140" width="48" height="2" fill="#3b82f6"/>

  <!-- Services label -->
  <text x="80" y="184" fill="#6b7280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.08em">WHAT WE DO</text>

  <!-- Service 1 -->
  <rect x="80" y="210" width="504" height="124" fill="#22262b" stroke="#374151" stroke-width="1" rx="2"/>
  <rect x="80" y="210" width="3" height="124" fill="#3b82f6"/>
  <text x="112" y="230" fill="#3b82f6" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Early project stage</text>
  <text x="112" y="265" fill="#e5e7eb" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">Technical Consultation</text>
  <text x="112" y="290" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">Architecture reviews, build-vs-buy,</text>
  <text x="112" y="310" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">roadmapping, and technical due diligence.</text>

  <!-- Service 2 -->
  <rect x="616" y="210" width="504" height="124" fill="#22262b" stroke="#374151" stroke-width="1" rx="2"/>
  <rect x="616" y="210" width="3" height="124" fill="#3b82f6"/>
  <text x="648" y="230" fill="#3b82f6" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Design through operation</text>
  <text x="648" y="265" fill="#e5e7eb" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">Software Delivery</text>
  <text x="648" y="290" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">Full-stack platforms, data modeling,</text>
  <text x="648" y="310" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">CI/CD, and operational tooling.</text>

  <!-- Service 3 -->
  <rect x="80" y="350" width="504" height="124" fill="#22262b" stroke="#374151" stroke-width="1" rx="2"/>
  <rect x="80" y="350" width="3" height="124" fill="#3b82f6"/>
  <text x="112" y="370" fill="#3b82f6" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">System connections</text>
  <text x="112" y="405" fill="#e5e7eb" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">Integrations and APIs</text>
  <text x="112" y="430" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">REST and event-driven APIs, legacy</text>
  <text x="112" y="450" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">integrations, and data pipelines.</text>

  <!-- Service 4 -->
  <rect x="616" y="350" width="504" height="124" fill="#22262b" stroke="#374151" stroke-width="1" rx="2"/>
  <rect x="616" y="350" width="3" height="124" fill="#3b82f6"/>
  <text x="648" y="370" fill="#3b82f6" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Streamline repetitive work</text>
  <text x="648" y="405" fill="#e5e7eb" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">Automation and Applied AI</text>
  <text x="648" y="430" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">Workflow automation, RAG and extraction,</text>
  <text x="648" y="450" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15">semantic search, and applied machine learning.</text>

  <!-- Footer -->
  <text x="80" y="540" fill="#6b7280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">Development &amp; products · 14 years of delivery</text>
  <text x="1120" y="540" fill="#9ca3af" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" text-anchor="end">erongo.net</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="627" width="1200" height="3" fill="#3b82f6"/>
</svg>
